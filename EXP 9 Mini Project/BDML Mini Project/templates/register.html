<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eef5ff;
}

.register-container {
    border-radius: 15px;
    overflow: hidden;
}

</style>

</head>

<body style="background-color:#eef5ff;">

<div class="container">

<div class="row register-container">

<!-- Left Side Image -->

<div class="col-md-6" style="margin-top:150px;">

<img src="/static/image/reg.jpg"
class="w-100">

</div>


<!-- Right Side Form -->

<div class="col-md-6 p-5">

<div class="shadow-lg p-5 m-5 bordered rounded"
style="background-color:white;">

<h2 class="text-center mb-4"
style="color:#164e8c">

Register

</h2>

<form action="/Register" method="post">


<div class="mb-3">

<label for="name"
class="form-label"
style="color:#164e8c;">

Name

</label>

<input type="text"
class="form-control"
name="username"
id="name"
placeholder="Enter your name"
required>

</div>


<div class="mb-3">

<label for="gender"
class="form-label"
style="color:#164e8c;">

Gender

</label>

<select class="form-control"
name="gender"
id="gender"
required>

<option value="">Select Gender</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

<option value="Other">Other</option>

</select>

</div>


<div class="mb-3">

<label for="age"
class="form-label"
style="color:#164e8c;">

Age

</label>

<input type="number"
class="form-control"
name="age"
id="age"
placeholder="Enter your age"
required>

</div>


<div class="mb-3">

<label for="password"
class="form-label"
style="color:#164e8c;">

Password

</label>

<input type="password"
class="form-control"
name="password"
id="password"
placeholder="Enter password"
required>

</div>


<div class="d-grid">

<button type="submit"
class="btn"
style="background-color:#164e8c; color:white;">

Register

</button>

</div>


<div class="text-center mt-3">

<p>

Already have an account?

<a href="/login"
class="text-primary">

Sign In

</a>

</p>

</div>

</form>

</div>

</div>

</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
