<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eef5ff;
}

.login-container {
    border-radius: 15px;
    overflow: hidden;
}

</style>

</head>

<body style="background-color:#eef5ff;">

<div class="container">

<div class="row login-container">

<!-- Left Side Image -->

<div class="col-md-6" style="margin-top:50px;">

<img src="/static/image/reg.jpg"
class="w-100">

</div>


<!-- Right Side Form -->

<div class="col-md-6 p-5">

<div class="shadow-lg p-5 m-5 bordered rounded"
style="background-color:white;">

<h2 class="text-center mb-4"
style="font-family:Arial; color:#164e8c;">

Login

</h2>

<form action="/login" method="post">

<div class="mb-3">

<label for="username"
class="form-label"
style="color:#164e8c;">

Username

</label>

<input type="text"
class="form-control"
name="username"
id="username"
placeholder="Enter your username"
required>

</div>


<div class="mb-3">

<label for="password"
class="form-label"
style="color:#164e8c;">

Password

</label>

<input type="password"
class="form-control"
name="password"
id="password"
placeholder="Enter your password"
required>

</div>


<div class="d-grid">

<button type="submit"
class="btn"
style="background-color:#164e8c; color:white;">

Login

</button>

</div>


<div class="text-center mt-3">

<p>
Don't have an account?

<a href="{{ url_for('register') }}" class="text-primary">
    Register
</a>

</p>

</div>

</form>

</div>

</div>

</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
