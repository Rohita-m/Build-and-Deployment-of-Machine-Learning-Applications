<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stock Price Predictor Web App</title>

<link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Arimo" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Hind:300" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
body {
    font-family: 'Arimo', sans-serif;
    background-color: #eef5ff;
    padding: 50px;
}

.login {
    max-width: 500px;
    margin: auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.12);
}

h1, h2 {
    color: #164e8c;
}

.footer-dark {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    background-color: #164e8c;
    color: white;
}
</style>
</head>

<body style="background-color: #eef5ff; font-family: Arial, sans-serif;">

<div class="login" style="background-color: white;">

<h1 style="color: #164e8c;">Stock Price Predictor</h1>

<h2 style="color: #333;">Welcome, {{ username }}!</h2>

<form action="{{ url_for('dashboard') }}" method="post">

<input type="number"
name="Open"
placeholder="Opening Price"
class="form-control mb-3"
required>

<input type="number"
name="High"
placeholder="Highest Price"
class="form-control mb-3"
required>

<input type="number"
name="Low"
placeholder="Lowest Price"
class="form-control mb-3"
required>

<input type="number"
name="Volume"
placeholder="Volume"
class="form-control mb-3"
required>

<button type="submit"
class="btn btn-primary w-100"
style="background-color: #164e8c; border: none;">
Predict
</button>

</form>

<br>

<h4 class="text-success"
style="background-color: #f1f7ff; color: #164e8c; padding: 12px; border-radius: 8px;">
{{ prediction_text }}
</h4>

</div>

<div class="footer-dark">
<footer>
<div class="container">
<p class="copyright">Stock Price Predictor © 2025</p>
</div>
</footer>
</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
